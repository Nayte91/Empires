  webserver:
    build:
      target: webserver__caddy--dev
    volumes:
      - ./public:/app/public:ro
      - ./system/webserver/Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      traefik.http.routers.sfa.rule: Host(`sfa.localhost`)
    ports:
      - "80:80"

  backend:
    build:
      target: backend__php--dev
    volumes:
      - .:/app:rw
      - ./system/backend/php-dev.ini:/usr/local/etc/php/conf.d/dev.ini:ro

###> Dev tools ###
  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"

  toolbox:
    image: corentinth/it-tools:latest
    ports:
      - "8080:80"
