# Fixture — the 'bretonneux' game, in the final state it reached in production.
#
# Captured from prod on 2026-08-03, after the game was finished (turn 15, expert A.S.T.,
# 14 players). It is the project's only sample of a real, fully played game: the scores
# are real, the purchase history is real, and so is its incompleteness — the operator did
# not record every purchase as it happened, which is why some turns hold no order at all.
#
# Identifiers are deliberately absent. Games and players are keyed by UUID in the schema;
# a loader must mint fresh ones, so nothing here can collide with an existing row.
#
# `finished_at` is what makes this a finished game — drop it and the app serves the
# dashboard instead of the chronicle, and the Evolution chart disappears with it.
#
# Faithful to the schema, with two deliberate departures:
#   - the three JSON columns (player.advances, player.credit_ledger, orders.lines) are
#     expanded into real YAML instead of embedded strings, so they can be read and edited;
#   - order timestamps are absent. created_at and validated_at are stamped by the domain
#     itself when an order is built and frozen, so a loader cannot honour a value from
#     here without reaching around the entities. Nothing depends on them: chronology is
#     carried by `turn`. They are omitted rather than written down and silently ignored.

game:
    slug: bretonneux
    current_turn: 15
    player_count: 14
    ast_version: expert
    # No region: from 12 players up a game draws on both the East and West sets at once.
    region: ~
    finished_at: '2026-08-02 18:51:37'

