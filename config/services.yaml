parameters:

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\:
        resource: '../src/'

    # Phase 1 crutch: userforged/shop-engine is a path-repository package, not
    # yet wired via a Symfony bundle (Phase 2). Without this glob its classes
    # are outside App\'s resource and vanish from the container silently.
    Userforged\ShopEngine\:
        resource: '../packages/userforged/shop-engine/src/'

when@test:
    services:
        Symfony\Component\Mercure\HubInterface: '@App\Tests\Support\Mercure\RecordingHub'
        App\Tests\Support\Mercure\RecordingHub:
            public: true
