parameters:

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\:
        resource: '../src/'

    # SQLite ignores every foreign key constraint — ON DELETE CASCADE included — unless
    # `PRAGMA foreign_keys=ON` is issued on each connection. Without this middleware the
    # cascades declared in the schema are inert decoration, which is how the dev database
    # accumulated player rows pointing at games that no longer exist.
    #
    # The priority is load-bearing, not cosmetic. DoctrineBundle wraps the highest priority
    # first, so the highest priority is the *innermost* driver; DAMA registers its own
    # middleware at 100 and opens a transaction right after connecting. Since the pragma is
    # a documented no-op inside a transaction, anything at or below 100 wraps DAMA from the
    # outside and silently fails to take effect under `when@test` — green in dev, inert in
    # the suite. Sitting above 100 puts this connect() inside DAMA's, before its BEGIN.
    Doctrine\DBAL\Driver\AbstractSQLiteDriver\Middleware\EnableForeignKeys:
        autoconfigure: false
        tags:
            - { name: 'doctrine.middleware', priority: 200 }

    # userforged/shop-engine now registers its own services via its bundle,
    # scanning only packages/userforged/shop-engine/src/. That scan never sees
    # these App\ classes, so the automatic "singly implemented interface"
    # aliasing (which used to bridge port -> adapter when both lived in this
    # same services.yaml) no longer fires across the bundle boundary — these
    # aliases restore it explicitly.
    Userforged\ShopEngine\CartStorageInterface: '@App\Infrastructure\Shop\SessionCartStorage'
    Userforged\ShopEngine\OrderRepositoryInterface: '@App\Infrastructure\Repository\OrderRepository'
    Userforged\ShopEngine\BuyerProviderInterface: '@App\Infrastructure\Shop\PlayerBuyerProvider'
    Userforged\ShopEngine\FulfillmentInterface: '@App\Engine\Shop\AdvanceFulfillment'
    Userforged\ShopEngine\ProductProviderInterface: '@App\Rules\Shop\AdvanceProductProvider'
    Userforged\ShopEngine\FacetProviderInterface: '@App\Rules\Shop\ShopConnector'
    Userforged\ShopEngine\PriceResolverInterface: '@App\Rules\Shop\AdvancePriceResolver'

# The fixtures live under system/, beside the migrations they resemble, so the App\ scan above
# never sees them. Registered per-environment rather than globally: they extend a class from
# doctrine/doctrine-fixtures-bundle, a dev dependency absent from a production install, so a
# global registration would fail to compile the container there.
when@dev:
    services:
        # autowire/autoconfigure restated here: the _defaults above belong to the top-level
        # services block and do not reach into a when@ section, so without these the class
        # loads but never receives the doctrine.fixture.orm tag that makes it discoverable.
        System\database\fixtures\:
            resource: '../system/database/fixtures/'
            autowire: true
            autoconfigure: true

when@test:
    services:
        # autowire/autoconfigure restated here: the _defaults above belong to the top-level
        # services block and do not reach into a when@ section, so without these the class
        # loads but never receives the doctrine.fixture.orm tag that makes it discoverable.
        System\database\fixtures\:
            resource: '../system/database/fixtures/'
            autowire: true
            autoconfigure: true

        Symfony\Component\Mercure\HubInterface: '@App\Tests\Support\Mercure\RecordingHub'
        App\Tests\Support\Mercure\RecordingHub:
            public: true
