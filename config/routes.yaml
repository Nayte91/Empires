controllers:
    resource:
        path: ../src/Presentation/Controller/
        namespace: App\Presentation\Controller
    type: attribute

app_game_index:
    path: /game
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: app_home
        permanent: true

app_operator_index:
    path: /game/{slug}/operator
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: app_operator_board
        permanent: true
    requirements:
        slug: '[a-z0-9-]+'
