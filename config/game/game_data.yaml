regions:
    west:
        name: "west"
        name2019: "Western Empires"
        name2024: "Mega Empires: The West"
        empires: ["assyria", "carthage", "celt", "egypt", "hatti", "hellas", "iberia", "minoa", "rome"]
    east:
        name: "east"
        name2019: "Eastern Empires"
        name2024: "Mega Empires: The East"
        empires: ["babylon", "dravidia", "indus", "kushan", "maurya", "nubia", "parthia", "persia", "saba"]

limits:
    max_cities: 9
    max_population: 55
    max_ships: 4
    # A permissive display ceiling for the StatPicker grid — not the hand-size limit. Exceeding a
    # hand's actual limit (HandSizeCalculator) is a legal game state on its own; see HandLimitRule
    # and the CutToLimit action.
    max_cards: 20
    max_turns: 20
    modes: ["basic", "expert"]
    min_players: 3
    max_players: 18
    # How many cards a hand may hold, before any advance of the player's own raises it. Read as
    # brackets, cheapest first: the last one the player count reaches wins.
    hand_size_brackets:
        - { from_players: 3, cards: 8 }
        - { from_players: 12, cards: 9 }
